      Sveltia CMS. Il lit config.yml au format Decap, et fournit son propre

      les pieds d'un éditeur est une mauvaise surprise. Pour mettre à jour,
      changer le numéro ici après avoir vérifié le changelog.

      script par le sien et à déployer un Worker OAuth — config.yml est commun
      aux deux.
    -->

      src="https://unpkg.com/@sveltia/cms@0.113.2/dist/sveltia-cms.js"
      type="module"
    ></script>
